openapi: "3.0.0"
info:
  title: Compliance Backend
  version: "1.0.0"
paths:
  # Wildcard patterns for all path depths — covers every FastAPI route
  # without maintaining a list.
  #
  # Nothing here says anything about authentication, and that is deliberate:
  # the Choreo gateway authenticates by default, so saying nothing is what
  # turns it on. These operations used to carry `x-auth-type: None`, which is
  # the opt-out — it told the gateway to forward every request unchecked, so
  # an unauthenticated call reached application code before anything refused
  # it. The backend has always verified the Asgardeo token itself, so nothing
  # was open; there was simply only one line of defence instead of two.
  #
  # The gateway only answers "is this someone". It cannot tell one endpoint
  # from another here, because these are wildcards. Every authorisation
  # decision — admin versus engineer, whose Evidence is whose — stays in the
  # backend and is unchanged.
  #
  # Replacing these wildcards with the real generated description is left for
  # later. That is what allows per-endpoint rules, request validation and a
  # developer portal worth reading, and it needs a deployed gateway to verify
  # against.
  "/{a}":
    parameters:
      - {name: a, in: path, required: true, schema: {type: string}}
    get:
      operationId: w1g
      responses: {"200": {description: OK}}
    post:
      operationId: w1p
      responses: {"200": {description: OK}}
    put:
      operationId: w1pu
      responses: {"200": {description: OK}}
    patch:
      operationId: w1pa
      responses: {"200": {description: OK}}
    delete:
      operationId: w1d
      responses: {"200": {description: OK}}
  "/{a}/{b}":
    parameters:
      - {name: a, in: path, required: true, schema: {type: string}}
      - {name: b, in: path, required: true, schema: {type: string}}
    get:
      operationId: w2g
      responses: {"200": {description: OK}}
    post:
      operationId: w2p
      responses: {"200": {description: OK}}
    put:
      operationId: w2pu
      responses: {"200": {description: OK}}
    patch:
      operationId: w2pa
      responses: {"200": {description: OK}}
    delete:
      operationId: w2d
      responses: {"200": {description: OK}}
  "/{a}/{b}/{c}":
    parameters:
      - {name: a, in: path, required: true, schema: {type: string}}
      - {name: b, in: path, required: true, schema: {type: string}}
      - {name: c, in: path, required: true, schema: {type: string}}
    get:
      operationId: w3g
      responses: {"200": {description: OK}}
    post:
      operationId: w3p
      responses: {"200": {description: OK}}
    put:
      operationId: w3pu
      responses: {"200": {description: OK}}
    patch:
      operationId: w3pa
      responses: {"200": {description: OK}}
    delete:
      operationId: w3d
      responses: {"200": {description: OK}}
  "/{a}/{b}/{c}/{d}":
    parameters:
      - {name: a, in: path, required: true, schema: {type: string}}
      - {name: b, in: path, required: true, schema: {type: string}}
      - {name: c, in: path, required: true, schema: {type: string}}
      - {name: d, in: path, required: true, schema: {type: string}}
    get:
      operationId: w4g
      responses: {"200": {description: OK}}
    post:
      operationId: w4p
      responses: {"200": {description: OK}}
    put:
      operationId: w4pu
      responses: {"200": {description: OK}}
    patch:
      operationId: w4pa
      responses: {"200": {description: OK}}
    delete:
      operationId: w4d
      responses: {"200": {description: OK}}
  "/{a}/{b}/{c}/{d}/{e}":
    parameters:
      - {name: a, in: path, required: true, schema: {type: string}}
      - {name: b, in: path, required: true, schema: {type: string}}
      - {name: c, in: path, required: true, schema: {type: string}}
      - {name: d, in: path, required: true, schema: {type: string}}
      - {name: e, in: path, required: true, schema: {type: string}}
    get:
      operationId: w5g
      responses: {"200": {description: OK}}
    post:
      operationId: w5p
      responses: {"200": {description: OK}}
    put:
      operationId: w5pu
      responses: {"200": {description: OK}}
    patch:
      operationId: w5pa
      responses: {"200": {description: OK}}
    delete:
      operationId: w5d
      responses: {"200": {description: OK}}
