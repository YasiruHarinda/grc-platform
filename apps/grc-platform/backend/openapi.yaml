      properties:
        description:
          type: string
        status:
          type: string
        completed_date:
          type: string
          format: date
          nullable: true
    RiskCategory:
      type: object
      description: A fixed-but-extensible risk classification (e.g. "PII / Sensitive Data Exposure").
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
    Escalation:
      type: object
      description: Created automatically by the compliance-entity's daily overdue-risk job, or manually via POST /api/v1/risks/{id}/escalate. Answered with a comment (POST .../escalations/{escalationId}/comment), which returns the risk to its assigner; the escalation itself stays OPEN until the assigner submits the risk for completion approval.
      properties:
        id:
          type: integer
        risk_id:
          type: integer
        new_treatment_strategy:
          type: string
          nullable: true
        action_plan_id:
          type: integer
          nullable: true
        decision:
          type: string
          nullable: true
          description: The management/lead comment that returned the risk to its assigner. Nil until someone comments.
        status:
          type: string
          enum:
          - OPEN
          - RESOLVED
        created_at:
          type: string
          format: date-time
    EscalationCommentRequest:
      type: object
      required:
      - comment
      properties:
        comment:
          type: string
    HistoryEntry:
      type: object
      description: One event in a risk's history (risk_change_log). Either a field diff (field_changed + old_value/new_value) or an event (details) — CREATE is used for both risk creation and action-plan creation, so it does not always imply a field diff.
      properties:
        id:
          type: integer
          format: int64
        risk_id:
          type: integer
        action:
          type: string
          enum:
          - CREATE
          - UPDATE
          - DELETE
          - SUBMIT
          - APPROVE
          - REJECT
          - ESCALATE
          - COMMENT
          - ASSESS
          - COMPLETE
          - CLOSE
          - CANCEL
        field_changed:
          type: string
          nullable: true
        old_value:
          type: string
          nullable: true
        new_value:
          type: string
          nullable: true
        details:
          type: object
          nullable: true
          description: 'Passed through untouched; shape varies by action, e.g. {"from","to","role","comment","stage","level","previousLevel","overdueDays","plan"}.'
          additionalProperties: true
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
