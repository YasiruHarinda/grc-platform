openapi: 3.0.3
info:
  title: GRC Platform Backend API
  description: Public-facing API for the GRC Platform (Audit Hub and Risk Hub). Authenticates
    callers via a Bearer JWT issued by Asgardeo and validated against the issuer's JWKS
    (RS256, iss/aud checked). Most data access is proxied to the internal Compliance
    Entity service; file uploads are proxied through this backend to Azure Blob Storage
    rather than issuing direct SAS URLs to clients.
  version: 1.0.0
servers:
- url: http://localhost:8081
  description: Local development
tags:
- name: Health
- name: Audit Dashboard
- name: Audit Frameworks
- name: Audit Framework Controls
- name: Audit Products
- name: Audit Users
- name: Audit Teams
- name: Audits
- name: Audit Controls
- name: Audit Trail
- name: Audit Evidence
- name: Audit Population
- name: Audit Sample
- name: Audit Comments
- name: AI Validations
- name: Risk Teams
- name: Risk Scores
- name: Risk Compliance References
- name: Risk Categories
- name: Risk User Pickers
- name: Privileges
- name: Employees
- name: Risks
- name: Risk Workflow
- name: Risk Assessment
- name: Risk Dashboard
- name: Risk Analytics
- name: Risk Action Plans
- name: Risk Action Steps
- name: Risk Escalations
- name: Risk History
- name: Risk Evidence
- name: Users
- name: Admin
security:
- bearerAuth: []
paths:
  /health:
    get:
      tags:
      - Health
      summary: Liveness/readiness probe
      description: Special-cased ahead of the Auth middleware (GET /health only) — never requires a Bearer token.
      operationId: healthCheck
      security: []
      responses:
        '200':
          description: Server is up
  # ---------------------------------------------------------------------------
  # Audit Hub
  # ---------------------------------------------------------------------------
  /api/v1/audit/dashboard:
    get:
      tags:
      - Audit Dashboard
      summary: Get the Audit Hub dashboard
      description: Scoped to the caller's role (compliance admin/team, internal team, external auditor, management) derived from their JWT groups claim.
      operationId: getAuditDashboard
      responses:
        '200':
          description: Dashboard data scoped to the caller's role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardData'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/audit/work-queue:
    get:
      tags:
      - Audit Dashboard
      summary: Get a paginated work-queue page for the authenticated user
      operationId: getAuditWorkQueue
      parameters:
      - name: tab
        in: query
        description: Which sub-list to page through.
        schema:
          type: string
          enum:
          - action-items
          - due-soon
          - overdue
          default: action-items
      - name: page
        in: query
        schema:
          type: integer
          default: 1
      - name: limit
        in: query
        schema:
          type: integer
          default: 25
          maximum: 100
      - name: teamIds
        in: query
        description: Repeatable; restricts results to these audit_team IDs.
        schema:
          type: array
          items:
            type: integer
        style: form
        explode: true
      - name: ownerIds
        in: query
        description: Repeatable; restricts results to these process-owner user IDs.
        schema:
          type: array
          items:
            type: integer
        style: form
        explode: true
      responses:
        '200':
          description: Paginated work-queue page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkQueuePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/audit/frameworks:
    get:
      tags:
      - Audit Frameworks
      summary: List audit frameworks
      description: Lookup data for the Create Audit form's framework dropdown.
      operationId: listAuditFrameworks
      responses:
        '200':
          description: List of frameworks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditFramework'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
      - Audit Frameworks
      summary: Create an audit framework
      operationId: createAuditFramework
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFrameworkRequest'
      responses:
        '201':
          description: Framework created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditFramework'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/audit/frameworks/{id}/controls:
    get:
      tags:
      - Audit Framework Controls
      summary: List current controls for a framework
      operationId: listAuditFrameworkControls
      parameters:
      - $ref: '#/components/parameters/FrameworkId'
      responses:
        '200':
          description: List of current framework controls
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FrameworkControlListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
      - Audit Framework Controls
      summary: Create a framework control
      operationId: createAuditFrameworkControl
      parameters:
      - $ref: '#/components/parameters/FrameworkId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFrameworkControlRequest'
      responses:
        '201':
          description: Framework control created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditFrameworkControl'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/audit/products:
    get:
      tags:
      - Audit Products
      summary: List audit products
      description: Lookup data for the Create Audit form's product dropdown.
      operationId: listAuditProducts
      responses:
        '200':
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditProduct'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
      - Audit Products
      summary: Create an audit product
      operationId: createAuditProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditProduct'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/audit/users:
    get:
      tags:
      - Audit Users
      summary: List active users for owner/auditor assignment dropdowns
      operationId: listAuditUsers
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserRef'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/audit/auditor-candidates:
    get:
      tags:
      - Audit Users
      summary: List users holding AUDIT_SELECT_SAMPLE for the Auditor POC picker
      description: Returns all users who hold AUDIT_SELECT_SAMPLE (INTERNAL or EXTERNAL) — used by the Auditor POC picker in Create Audit / Manage Controls.
      operationId: listAuditorCandidates
      responses:
        '200':
          description: List of candidate users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserRef'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/audit/teams:
    get:
      tags:
      - Audit Teams
      summary: List active audit teams for the team assignment dropdown
      description: '?includeInactive=true returns every status (Manage Audit Hub admin table only) — additionally gated on ManageAuditHub.'
      operationId: listAuditTeams
      parameters:
      - name: includeInactive
        in: query
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
      responses:
        '200':
          description: List of teams
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditTeam'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
      - Audit Teams
      summary: Create an audit team
      description: The Manage Audit Hub "Add Team" dialog. Gated on ManageAuditHub.
      operationId: createAuditTeam
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAuditTeamRequest'
      responses:
        '201':
          description: Team created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditTeam'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/audit/teams/{id}:
    put:
      tags:
      - Audit Teams
      summary: Update an audit team
      operationId: updateAuditTeam
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAuditTeamRequest'
      responses:
        '200':
          description: Team updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditTeam'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/audits:
    get:
      tags:
      - Audits
      summary: List audits
      operationId: listAudits
      responses:
        '200':
          description: List of audits
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
      - Audits
      summary: Create an audit
      operationId: createAudit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAuditRequest'
      responses:
        '201':
          description: Audit created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Audit'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/audits/{id}:
    get:
      tags:
      - Audits
      summary: Get an audit by ID
      operationId: getAudit
      parameters:
      - $ref: '#/components/parameters/AuditId'
      responses:
        '200':
          description: The audit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Audit'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
      - Audits
      summary: Update an audit
      operationId: updateAudit
      parameters:
      - $ref: '#/components/parameters/AuditId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAuditRequest'
      responses:
        '204':
          description: Audit updated
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
      - Audits
      summary: Soft-delete an audit
      operationId: deleteAudit
      parameters:
      - $ref: '#/components/parameters/AuditId'
      responses:
        '204':
          description: Audit deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/audits/{id}/controls:
    get:
      tags:
      - Audit Controls
      summary: List controls for an audit
      operationId: listAuditControls
      parameters:
      - $ref: '#/components/parameters/AuditId'
      responses:
        '200':
          description: List of controls
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
      - Audit Controls
      summary: Add a control to an audit
      operationId: addAuditControl
      parameters:
      - $ref: '#/components/parameters/AuditId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddControlRequest'
      responses:
        '201':
          description: Control created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditControl'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/audits/{id}/controls/bulk:
    post:
      tags:
      - Audit Controls
      summary: Bulk-add controls to an audit
      description: Used by the Create Audit form when copying controls from a previous audit or uploading a CSV.
      operationId: bulkAddAuditControls
      parameters:
      - $ref: '#/components/parameters/AuditId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkAddControlsRequest'
      responses:
        '201':
          description: Controls created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/audits/{id}/controls/{controlId}:
    get:
      tags:
      - Audit Controls
      summary: Get a control by ID
      operationId: getAuditControl
      parameters:
      - $ref: '#/components/parameters/AuditId'
      - $ref: '#/components/parameters/ControlId'
      responses:
        '200':
          description: The control
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditControl'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
      - Audit Controls
      summary: Update a control
      operationId: updateAuditControl
      parameters:
      - $ref: '#/components/parameters/AuditId'
      - $ref: '#/components/parameters/ControlId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateControlRequest'
      responses:
        '204':
          description: Control updated
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
      - Audit Controls
      summary: Delete a control
      operationId: deleteAuditControl
      parameters:
      - $ref: '#/components/parameters/AuditId'
      - $ref: '#/components/parameters/ControlId'
      responses:
        '204':
          description: Control deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/audits/{id}/controls/{controlId}/status:
    patch:
      tags:
      - Audit Controls
      summary: Update a control's status
      operationId: updateAuditControlStatus
      parameters:
      - $ref: '#/components/parameters/AuditId'
      - $ref: '#/components/parameters/ControlId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStatusRequest'
      responses:
        '204':
          description: Status updated
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/audits/{id}/controls/{controlId}/status/override:
    post:
      tags:
      - Audit Controls
      summary: Backward-override a control's status
      description: Target status is validated as a backward-only rank move by the entity, not the ordinary forward workflow transitions. ManageControls-gated.
      operationId: overrideAuditControlStatus
      parameters:
      - $ref: '#/components/parameters/AuditId'
      - $ref: '#/components/parameters/ControlId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OverrideStatusRequest'
      responses:
        '204':
          description: Status overridden
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/audits/{id}/controls/{controlId}/trail:
    get:
      tags:
      - Audit Trail
      summary: List a control's immutable history
      description: Append-only audit_trail events for the control, newest first — feeds the control drawer's History tab.
      operationId: listControlTrail
      parameters:
      - $ref: '#/components/parameters/AuditId'
      - $ref: '#/components/parameters/ControlId'
      responses:
        '200':
          description: Control trail entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrailListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/audits/{id}/trail:
    get:
      tags:
      - Audit Trail
      summary: List an audit's whole activity log
      description: Audit-level events plus every control's events together, newest first, for the audit-wide Activity Log page.
      operationId: listAuditTrail
      parameters:
      - $ref: '#/components/parameters/AuditId'
      - name: limit
        in: query
        schema:
          type: integer
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
      - name: controlId
        in: query
        description: Repeatable; OR-matched control-id filter.
        schema:
          type: array
          items:
            type: integer
        style: form
        explode: true
      - name: from
        in: query
        description: Inclusive lower bound, YYYY-MM-DD.
        schema:
          type: string
          format: date
      - name: to
        in: query
        description: Inclusive upper bound, YYYY-MM-DD.
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Audit trail entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrailListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
