      description: Replaces the old MANAGEMENT action plan as the way an escalation is answered — a comment alone returns the risk to its assigner (ESCALATED → IN_REMEDIATION). Deliberately not privilege-gated beyond an authenticated session; the entitled commenter for a MEDIUM/LOW risk is a line manager frozen on the escalation row at escalation time, who holds no Risk Hub privilege. The real check is an identity match in the service against the risk's Management Approver (HIGH) or the frozen leads (MEDIUM/LOW), or a compliance-admin override.
