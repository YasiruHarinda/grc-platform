          type: string
          format: date
          nullable: true
        plan_type:
          type: string
          description: Always STANDARD on new plans. MANAGEMENT plans were how an escalation used to be answered before that was replaced by a comment (see POST .../escalations/{escalationId}/comment); the value is kept only because historical rows may still carry it.
          enum:
          - STANDARD
          - MANAGEMENT
        created_by:
          type: string
          nullable: true
    CreateActionPlanRequest:
      type: object
      properties:
        description:
          type: string
        action_owner_id:
          type: integer
          nullable: true
        plan_type:
          type: string
          enum:
          - STANDARD
          - MANAGEMENT
        steps:
          type: array
          items:
            type: string
