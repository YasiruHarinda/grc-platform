          type: string
        count:
          type: integer
    RiskLevelCount:
      type: object
      properties:
        risk_level:
          type: string
        color_code:
          type: string
        count:
          type: integer
    HeatmapCell:
      type: object
      properties:
        likelihood:
          type: integer
        impact:
          type: integer
        risk_level:
          type: string
        color_code:
          type: string
        count:
          type: integer
    RegisterCertShare:
      type: object
      properties:
        register_name:
          type: string
        cert_name:
          type: string
        count:
          type: integer
        percentage:
          type: number
          format: double
    RegisterStatusLevelCount:
      type: object
      properties:
        bucket:
          type: string
          description: CLOSED, or an open risk's treatment strategy.
        risk_level:
          type: string
        color_code:
          type: string
        count:
          type: integer
    RegisterAnalytics:
      type: object
      description: One per-register dashboard section. Registers with no risks at all are omitted.
      properties:
        register_id:
          type: integer
        register_name:
          type: string
        open_count:
          type: integer
        heatmap:
          type: array
          items:
            $ref: '#/components/schemas/HeatmapCell'
        status_levels:
          type: array
          items:
            $ref: '#/components/schemas/RegisterStatusLevelCount'
    RepeatedRiskOccurrence:
      type: object
      properties:
        register_name:
          type: string
        status:
          type: string
          enum:
          - OPEN
          - CLOSED
        risk_level:
          type: string
        color_code:
          type: string
    RepeatedComplianceRisk:
      type: object
      description: One cert-tagged risk title that appears in two or more source registers.
      properties:
        risk_title:
          type: string
        occurrences:
          type: array
          items:
            $ref: '#/components/schemas/RepeatedRiskOccurrence'
    HighRiskItem:
      type: object
      properties:
        id:
          type: integer
        risk_code:
          type: string
        risk_title:
          type: string
        register_name:
          type: string
        owner_name:
          type: string
        identified_date:
          type: string
          format: date
          nullable: true
        treatment_strategy:
          type: string
          nullable: true
        implementation_date:
          type: string
          format: date
          nullable: true
    DashboardSummary:
      type: object
      description: Full payload for GET /api/v1/risks/dashboard. CANCELLED risks are excluded everywhere; every field is open-risks-only except registers[].status_levels.
      properties:
        summary:
          $ref: '#/components/schemas/RiskStatusSummary'
        treatment_by_register:
          type: array
          items:
            $ref: '#/components/schemas/RegisterTreatmentCount'
        level_counts:
          type: array
          items:
            $ref: '#/components/schemas/RiskLevelCount'
        org_heatmap:
          type: array
          items:
            $ref: '#/components/schemas/HeatmapCell'
        cert_distribution:
          type: array
          items:
            $ref: '#/components/schemas/RegisterCertShare'
        registers:
          type: array
          items:
            $ref: '#/components/schemas/RegisterAnalytics'
        repeated_compliance_risks:
          type: array
          items:
            $ref: '#/components/schemas/RepeatedComplianceRisk'
        high_risks:
          type: array
          items:
            $ref: '#/components/schemas/HighRiskItem'
    # --- Risk Hub: analytics ----------------------------------------------------
    AnalyticsKPIs:
      type: object
      properties:
        new_risks_this_month:
          type: integer
        avg_days_to_close:
          type: number
          format: double
          nullable: true
        avg_effective_score:
          type: number
          format: double
          nullable: true
    TrendPoint:
      type: object
      properties:
        month:
          type: string
          description: First-of-month date, YYYY-MM-01.
        identified_count:
          type: integer
        closed_count:
          type: integer
        avg_score:
          type: number
          format: double
          nullable: true
    MonthLevelCount:
      type: object
      properties:
        month:
          type: string
        risk_level:
          type: string
        color_code:
          type: string
        count:
          type: integer
    MonthRegisterCount:
      type: object
      properties:
        month:
          type: string
        register_name:
          type: string
        count:
          type: integer
    RegisterShare:
      type: object
      properties:
        register_name:
          type: string
        count:
          type: integer
    ComplianceShare:
      type: object
      properties:
        compliance_name:
          type: string
        count:
          type: integer
    TreatmentShare:
      type: object
      properties:
        treatment_strategy:
          type: string
        count:
          type: integer
    WorkflowStageCount:
      type: object
      properties:
        workflow_status:
          type: string
        count:
          type: integer
    AgingRiskItem:
      type: object
      properties:
        id:
          type: integer
        risk_code:
          type: string
        risk_title:
          type: string
        register_name:
          type: string
        owner_name:
          type: string
        risk_level:
          type: string
        color_code:
          type: string
        identified_date:
          type: string
          format: date
          nullable: true
        age_days:
          type: integer
    AnalyticsSummary:
      type: object
      description: Full payload for GET /api/v1/risks/analytics/summary — the "over time" companion to DashboardSummary's point-in-time snapshot.
      properties:
        kpis:
          $ref: '#/components/schemas/AnalyticsKPIs'
        trend:
          type: array
          items:
            $ref: '#/components/schemas/TrendPoint'
        level_distribution:
          type: array
          items:
            $ref: '#/components/schemas/MonthLevelCount'
        identified_by_register:
          type: array
          items:
            $ref: '#/components/schemas/MonthRegisterCount'
        closed_by_register:
          type: array
          items:
            $ref: '#/components/schemas/MonthRegisterCount'
        register_shares:
          type: array
          items:
            $ref: '#/components/schemas/RegisterShare'
        compliance_distribution:
          type: array
          items:
            $ref: '#/components/schemas/ComplianceShare'
        treatment_mix:
          type: array
          items:
            $ref: '#/components/schemas/TreatmentShare'
        workflow_funnel:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowStageCount'
        aging_risks:
          type: array
          items:
            $ref: '#/components/schemas/AgingRiskItem'
    # --- Admin Console -----------------------------------------------------
    DirectorySearchResult:
      type: object
      properties:
        uuid:
          type: string
        email:
          type: string
        displayName:
          type: string
    AdminGrant:
      type: object
      description: One row of user_role_grant, resolved to names the Admin Console can render without a second lookup.
      properties:
        id:
          type: integer
        roleId:
          type: integer
        roleName:
          type: string
        module:
          type: string
          enum:
          - RISK
          - AUDIT
          - SHARED
        scopeType:
          type: string
        scopeId:
          type: integer
        scopeBasis:
          type: string
        scopeTeamType:
          type: string
        scopeName:
          type: string
    AdminUser:
      type: object
      properties:
        id:
          type: integer
        uuid:
          type: string
        displayName:
          type: string
        email:
          type: string
        userType:
          type: string
          enum:
          - INTERNAL
          - EXTERNAL
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
          - REMOVED
        createdOn:
          type: string
          format: date-time
        grants:
          type: array
          items:
            $ref: '#/components/schemas/AdminGrant'
    AdminRole:
      type: object
      description: A row of the shared role table, for populating the grant editor's role picker. Never includes AUDIT roles.
      properties:
        id:
          type: integer
        roleName:
          type: string
        description:
          type: string
        module:
          type: string
        scopeBasis:
          type: string
        assignableUserType:
          type: string
          enum:
          - INTERNAL
          - EXTERNAL
        status:
          type: string
    CreateAdminUserRequest:
      type: object
      required:
      - uuid
      properties:
        uuid:
          type: string
        userType:
          type: string
          description: INTERNAL or EXTERNAL. Empty defaults to INTERNAL.
          enum:
          - INTERNAL
          - EXTERNAL
    CreateAdminUserResponse:
      type: object
      properties:
        id:
          type: integer
        uuid:
          type: string
        displayName:
          type: string
        email:
          type: string
    UpdateUserStatusRequest:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
          - REMOVED
    CreateGrantRequest:
      type: object
      required:
      - roleId
      - scopeType
      - scopeId
      properties:
        roleId:
          type: integer
        scopeType:
          type: string
        scopeId:
          type: integer
    # --- Audit Teams --------------------------------------------------------
    CreateAuditTeamRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
        status:
          type: string
          description: Defaults to ACTIVE when omitted.
          enum:
          - ACTIVE
          - INACTIVE
    UpdateAuditTeamRequest:
      type: object
      required:
      - name
      - status
      properties:
        name:
          type: string
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
    # --- Risk Teams -----------------------------------------------------------
    CreateRiskTeamRequest:
      type: object
      required:
      - name
      - team_type
      properties:
        name:
          type: string
        code:
          type: string
          nullable: true
        description:
          type: string
        team_type:
          type: string
    UpdateRiskTeamRequest:
      type: object
      required:
      - name
      - team_type
      - status
      properties:
        name:
          type: string
        code:
          type: string
          nullable: true
        description:
          type: string
        team_type:
          type: string
        status:
          type: string
    # --- Risk Compliance References -----------------------------------------
    CreateComplianceReferenceRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
        description:
          type: string
    UpdateComplianceReferenceRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
        description:
          type: string
    # --- Risk Categories ------------------------------------------------------
    CreateRiskCategoryRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
        description:
          type: string
    UpdateRiskCategoryRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
        description:
          type: string
    # --- Risk Evidence --------------------------------------------------------
    RiskEvidence:
      type: object
      properties:
        id:
          type: integer
        risk_id:
          type: integer
        action_plan_id:
          type: integer
          nullable: true
        file_name:
          type: string
        file_path:
          type: string
        note:
          type: string
        evidence_type:
          type: string
          enum:
          - ACTION_PLAN_ATTACHMENT
          - FINAL_APPROVAL_ATTACHMENT
        created_by:
          type: string
        created_by_email:
          type: string
        created_at:
          type: string
          format: date-time
