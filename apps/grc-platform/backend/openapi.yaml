  /api/v1/users/resolve:
    post:
      tags:
      - Users
      summary: Resolve an employee's email to an internal user, provisioning one if needed
      description: Links an HR entity employee (as returned by GET /api/v1/employees/search) to an internal user.id, creating the row on the fly when it doesn't exist. The display name is always looked up from the HR entity, never taken from the request body.
      operationId: resolveUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveUserRequest'
      responses:
        '200':
          description: Resolved (or newly provisioned) user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  # ---------------------------------------------------------------------------
  # Admin Console — every route below requires MANAGE_USERS GLOBAL
  # ---------------------------------------------------------------------------
  /api/v1/admin/directory/search:
    get:
      tags:
      - Admin
      summary: Search the internal WSO2-org directory snapshot by name/email substring
      description: Powers the "Add User" typeahead for INTERNAL users — a snapshot substring match, not a live SCIM call.
      operationId: searchAdminDirectory
      parameters:
      - name: q
        in: query
        required: true
        description: Search substring; must be at least 2 characters.
        schema:
          type: string
      responses:
        '200':
          description: Matching directory entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DirectorySearchResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/admin/directory/search-external:
    get:
      tags:
      - Admin
      summary: Search the external auditor organization directory by name/email substring
      description: Powers the "Add User" typeahead once the EXTERNAL user type is selected — a live SCIM call against the external org, unlike the internal snapshot search.
      operationId: searchAdminExternalDirectory
      parameters:
      - name: q
        in: query
        required: true
        description: Search substring; must be at least 2 characters.
        schema:
          type: string
      responses:
        '200':
          description: Matching directory entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DirectorySearchResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/admin/users:
    get:
      tags:
      - Admin
      summary: List every platform user with their resolved grants
      operationId: listAdminUsers
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
      - Admin
      summary: Provision a platform user by uuid
      description: Requires a directory match (internal WSO2-org or external auditor org, per userType) — nothing is stored beyond the uuid itself.
      operationId: createAdminUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAdminUserRequest'
      responses:
        '201':
          description: User provisioned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAdminUserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/admin/users/{id}/status:
    patch:
      tags:
      - Admin
      summary: Change a platform user's status
      description: A caller may not change their own status — that would zero all of their own privileges.
      operationId: updateAdminUserStatus
      parameters:
      - $ref: '#/components/parameters/AdminUserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserStatusRequest'
      responses:
        '204':
          description: Status updated
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/admin/users/{id}/grants:
    post:
      tags:
      - Admin
      summary: Grant a role to a user in a scope
      operationId: createAdminGrant
      parameters:
      - $ref: '#/components/parameters/AdminUserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGrantRequest'
      responses:
        '201':
          description: Grant created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminGrant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/admin/users/{id}/grants/{grantId}:
    delete:
      tags:
      - Admin
      summary: Revoke a user's role grant
      description: The revoking caller is always the authenticated user, never a client-supplied value.
      operationId: revokeAdminGrant
      parameters:
      - $ref: '#/components/parameters/AdminUserId'
      - name: grantId
        in: path
        required: true
        schema:
          type: integer
      responses:
        '204':
          description: Grant revoked
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/admin/roles:
    get:
      tags:
      - Admin
      summary: List assignable roles for the grant editor's role picker
      description: Never includes AUDIT roles.
      operationId: listAdminRoles
      responses:
        '200':
          description: List of roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminRole'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Asgardeo-issued JWT, validated by signature (RS256 via JWKS), issuer, and audience. Sent as `Authorization Bearer <token>`. Not required for GET /health.
  parameters:
    AuditId:
      name: id
      in: path
      required: true
      description: Audit ID.
      schema:
        type: integer
    ControlId:
      name: controlId
      in: path
      required: true
      schema:
        type: integer
    FrameworkId:
      name: id
      in: path
      required: true
      description: Framework ID.
      schema:
        type: integer
    FileId:
      name: fileId
      in: path
      required: true
      schema:
        type: integer
    RiskId:
      name: id
      in: path
      required: true
      description: Risk ID.
      schema:
        type: integer
    PlanId:
      name: planId
      in: path
      required: true
      schema:
        type: integer
    StepId:
      name: stepId
      in: path
      required: true
      schema:
        type: integer
    EscalationId:
      name: escalationId
      in: path
      required: true
      schema:
        type: integer
    AdminUserId:
      name: id
      in: path
      required: true
      description: Platform user ID.
      schema:
        type: integer
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: The caller lacks the privilege required for this action
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: The resource is not in a state that allows this action
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntity:
      description: The request is well-formed but refers to something that could not be verified (e.g. an unrecognised employee email)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PayloadTooLarge:
      description: Uploaded file exceeds the 25 MiB limit
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Per-caller rate limit exceeded (Evidence Portal proxy group; 10 req/s sustained, burst 20)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    # --- Shared -----------------------------------------------------------
    Error:
      type: object
      description: Standard JSON error envelope returned on every non-2xx response.
      properties:
        message:
          type: string
    StatusResponse:
      type: object
      description: Generic status-change acknowledgement.
      properties:
        status:
          type: string
    FileUploadResult:
      type: object
      description: Returned by every proxied file-upload endpoint once the backend has written the blob to Azure.
      properties:
        fileName:
          type: string
          description: Sanitized base file name.
        blobName:
          type: string
          description: Full blob path the client echoes back on submit.
        size:
          type: integer
          format: int64
    # --- Users (shared) -----------------------------------------------------
    User:
      type: object
      description: Mirrors the shared `user` table owned by the Compliance Entity.
      properties:
        id:
          type: integer
        display_name:
          type: string
        email:
          type: string
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
          - REMOVED
        risk_team_ids:
          type: array
          items:
            type: integer
          description: The user's risk-team memberships (zero or more); empty, never null, when the user belongs to no risk team.
    MyProfileResponse:
      type: object
      properties:
        first_name:
          type: string
        last_name:
          type: string
        thumbnail_url:
          type: string
    ResolveUserRequest:
      type: object
      required:
      - email
      properties:
        email:
          type: string
    # --- Audit Hub: lookups -------------------------------------------------
    UserRef:
      type: object
      description: Lightweight user record for owner/auditor assignment dropdowns.
      properties:
        id:
          type: integer
        displayName:
          type: string
        email:
          type: string
        userType:
          type: string
          enum:
          - INTERNAL
          - EXTERNAL
        profileUrl:
          type: string
          nullable: true
    AuditTeam:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
    AuditFramework:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        version:
          type: string
          nullable: true
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateFrameworkRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
        version:
          type: string
          nullable: true
    AuditFrameworkControl:
      type: object
      description: One immutable version of a control definition from the framework catalog.
      properties:
        id:
          type: integer
        frameworkId:
          type: integer
        controlNumber:
          type: string
        description:
          type: string
        evidenceRequirement:
          type: string
          nullable: true
        requirementType:
          type: string
          enum:
          - DESIGN
          - OE
        controlType:
          type: string
          enum:
          - CONFIG
          - NON_CONFIG
        scope:
          type: string
          enum:
          - COMMON
          - PRODUCT_SPECIFIC
        version:
          type: integer
        isCurrent:
          type: boolean
        createdOn:
          type: string
          format: date-time
    FrameworkControlListResponse:
      type: object
      properties:
        controls:
          type: array
          items:
            $ref: '#/components/schemas/AuditFrameworkControl'
        total:
          type: integer
    CreateFrameworkControlRequest:
      type: object
      required:
      - controlNumber
      - description
      - requirementType
      - controlType
      - scope
      properties:
        controlNumber:
          type: string
        description:
          type: string
        evidenceRequirement:
          type: string
          nullable: true
        requirementType:
          type: string
          enum:
          - DESIGN
          - OE
        controlType:
          type: string
          enum:
          - CONFIG
          - NON_CONFIG
        scope:
          type: string
          enum:
          - COMMON
          - PRODUCT_SPECIFIC
    AuditProduct:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateProductRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
    # --- Audit Hub: audits & controls ---------------------------------------
    AuditFrameworkRef:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        version:
          type: string
          nullable: true
    AuditProductRef:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
    ControlCounts:
      type: object
      properties:
        total:
          type: integer
        approved:
          type: integer
        overdue:
          type: integer
    Audit:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        framework:
          $ref: '#/components/schemas/AuditFrameworkRef'
        product:
          $ref: '#/components/schemas/AuditProductRef'
        periodStart:
          type: string
          format: date
        periodEnd:
          type: string
          format: date
        status:
          type: string
        scopeDescription:
          type: string
          nullable: true
        controlCounts:
          $ref: '#/components/schemas/ControlCounts'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AuditListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Audit'
        total:
          type: integer
    CreateAuditRequest:
      type: object
      required:
      - name
      - frameworkId
      - productId
      - periodStart
      - periodEnd
      properties:
        name:
          type: string
        frameworkId:
          type: integer
        productId:
          type: integer
        periodStart:
          type: string
          format: date
        periodEnd:
          type: string
          format: date
        scopeDescription:
          type: string
          nullable: true
    UpdateAuditRequest:
      type: object
      description: All fields optional; omitted/null means "do not change".
      properties:
        name:
          type: string
          nullable: true
        periodStart:
          type: string
          format: date
          nullable: true
        periodEnd:
          type: string
          format: date
          nullable: true
        scopeDescription:
          type: string
          nullable: true
        status:
          type: string
          nullable: true
    PopulationDetails:
      type: object
      description: OE-control population-phase fields, mapping to a row in audit_population.
      properties:
        description:
          type: string
        referenceNumber:
          type: integer
          nullable: true
        dueDate:
          type: string
          format: date
          nullable: true
        comments:
          type: string
          nullable: true
        ownerId:
          type: integer
          nullable: true
        teamId:
          type: integer
          nullable: true
    AddControlRequest:
      type: object
      required:
      - controlNumber
      - description
      - requirementType
      - controlType
      - scope
      properties:
        controlSource:
          type: string
          description: Defaults to MANUAL.
          enum:
          - MANUAL
          - COPIED
          - CSV
        controlNumber:
          type: string
        description:
          type: string
        evidenceRequirement:
          type: string
          nullable: true
        requirementType:
          type: string
          enum:
          - DESIGN
          - OE
        controlType:
          type: string
          enum:
          - CONFIG
          - NON_CONFIG
        scope:
          type: string
          enum:
          - COMMON
          - PRODUCT_SPECIFIC
        ownerId:
          type: integer
          nullable: true
        teamId:
          type: integer
          nullable: true
        auditorId:
          type: integer
          nullable: true
        dueDate:
          type: string
          format: date
          nullable: true
        population:
          nullable: true
          anyOf:
          - $ref: '#/components/schemas/PopulationDetails'
          description: OE controls only.
        pushToFramework:
          type: boolean
          description: Also writes the control into the audit's framework catalog as a new version.
        sourceFrameworkControlId:
          type: integer
          nullable: true
          description: Set when pushToFramework edits an existing catalog control rather than creating the first version.
    BulkAddControlsRequest:
      type: object
      properties:
        controls:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/AddControlRequest'
    UpdateControlRequest:
      type: object
      description: All fields optional; omitted/null means "do not change".
      properties:
        controlNumber:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        evidenceRequirement:
          type: string
          nullable: true
        requirementType:
          type: string
          nullable: true
          enum:
          - DESIGN
          - OE
        controlType:
          type: string
          nullable: true
          enum:
          - CONFIG
          - NON_CONFIG
        scope:
          type: string
          nullable: true
          enum:
          - COMMON
          - PRODUCT_SPECIFIC
        ownerId:
          type: integer
          nullable: true
        teamId:
          type: integer
          nullable: true
        auditorId:
          type: integer
          nullable: true
        dueDate:
          type: string
          format: date
          nullable: true
        population:
          nullable: true
          anyOf:
          - $ref: '#/components/schemas/PopulationDetails'
          description: Set only when editing an OE control's population details; null leaves them unchanged.
    UpdateStatusRequest:
      type: object
      required:
      - status
      properties:
        status:
          type: string
        comment:
          type: string
          nullable: true
    OverrideStatusRequest:
      type: object
      description: Unlike UpdateStatusRequest, the target status is validated as a backward-only rank move by the entity, not the ordinary forward workflow transitions.
      required:
      - status
      properties:
        status:
          type: string
    AuditControl:
      type: object
      description: A control under evaluation within an audit. Owns its full definition text directly (never FK-linked to the framework catalog).
      properties:
        id:
          type: integer
        auditId:
          type: integer
        ownerId:
          type: integer
          nullable: true
        ownerName:
          type: string
          nullable: true
        teamId:
          type: integer
          nullable: true
        teamName:
          type: string
          nullable: true
        auditorId:
          type: integer
          nullable: true
        auditorName:
          type: string
          nullable: true
        auditorEmail:
          type: string
          nullable: true
          description: Backs the assigned-auditor gate for population/sample/evidence validation.
        controlNumber:
          type: string
        description:
          type: string
        evidenceRequirement:
          type: string
          nullable: true
        requirementType:
          type: string
          enum:
          - DESIGN
          - OE
        controlType:
          type: string
          enum:
          - CONFIG
          - NON_CONFIG
        scope:
          type: string
          enum:
          - COMMON
          - PRODUCT_SPECIFIC
        dueDate:
          type: string
          format: date
          nullable: true
        status:
          type: string
        statusOverridden:
          type: boolean
          description: Whether this control's current status was set by a backward status override rather than the ordinary workflow.
        overriddenBy:
          type: string
          nullable: true
        overriddenAt:
          type: string
          format: date-time
          nullable: true
        sampleReference:
          type: string
          nullable: true
        sampleFileUrl:
          type: string
          nullable: true
        sampleFileName:
          type: string
          nullable: true
        comments:
          type: string
          nullable: true
        controlSource:
          type: string
          enum:
          - MANUAL
          - COPIED
          - CSV
        isManuallyAdded:
          type: boolean
        isOverdue:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        populationDescription:
          type: string
          nullable: true
        populationComments:
          type: string
          nullable: true
        populationDueDate:
          type: string
          format: date
          nullable: true
        populationOwnerName:
          type: string
          nullable: true
        populationTeamName:
          type: string
          nullable: true
    ControlListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditControl'
        total:
          type: integer
    # --- Audit Hub: evidence / population / sample --------------------------
    AuditEvidenceFile:
      type: object
      properties:
        id:
          type: integer
        evidenceId:
          type: integer
        fileName:
          type: string
        filePath:
          type: string
        fileType:
          type: string
          nullable: true
        fileSize:
          type: integer
          format: int64
          nullable: true
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        readUrl:
          type: string
          nullable: true
          description: Backend proxy download URL, computed at list time.
    AuditEvidence:
      type: object
      description: One evidence submission round for a control.
      properties:
        id:
          type: integer
        controlId:
          type: integer
        status:
          type: string
        folderPath:
          type: string
        files:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvidenceFile'
        attestation:
          type: string
          description: Written justification for a round with no files. Empty for ordinary rounds.
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
    UploadLinkResponse:
      type: object
      properties:
        folderPath:
          type: string
          description: Azure Blob prefix to use for this upload session (human-readable, deterministic — not per-session).
        expiresAt:
          type: string
          format: date-time
    EvidenceFileRef:
      type: object
      description: Identifies one already-uploaded blob by its stored blob name and original file name.
      properties:
        blobName:
          type: string
        fileName:
          type: string
    SubmitEvidenceRequest:
      type: object
      properties:
        files:
          type: array
          items:
            $ref: '#/components/schemas/EvidenceFileRef'
        attestation:
          type: string
          description: Fileless-completion justification. Only honored when files is empty AND the caller holds ManageControls.
    PopulationSubmitRequest:
      type: object
      properties:
        folderPath:
          type: string
        attestation:
          type: string
          description: Written note standing in for population files — required when the folder has none.
    AuditPopulation:
      type: object
      description: One population round for an OE control. A control normally has exactly one round for its whole lifecycle.
      properties:
        id:
          type: integer
        controlId:
          type: integer
        status:
          type: string
          enum:
          - PENDING
          - SUBMITTED
          - COMPLIANCE_APPROVED
          - COMPLIANCE_REJECTED
          - APPROVED
          - AUDITOR_REJECTED
        referenceNumber:
          type: integer
