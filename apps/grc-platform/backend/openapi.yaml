    post:
      tags:
      - Risk Evidence
      summary: Upload a risk evidence file
      description: 'Multipart form upload (fields: file, evidenceType, actionPlanId (optional, required for FINAL_APPROVAL_ATTACHMENT), note (optional)). Bytes travel browser -> backend -> Compliance Entity -> Azure; no SAS is ever handed to the client. evidenceType ACTION_PLAN_ATTACHMENT requires being the risk''s assigner (or compliance-admin override); FINAL_APPROVAL_ATTACHMENT requires being the action plan''s action owner (or compliance-admin override).'
      operationId: uploadRiskEvidence
      parameters:
      - $ref: '#/components/parameters/RiskId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              - evidenceType
              properties:
                file:
                  type: string
                  format: binary
                evidenceType:
                  type: string
                  enum:
                  - ACTION_PLAN_ATTACHMENT
                  - FINAL_APPROVAL_ATTACHMENT
                actionPlanId:
                  type: integer
                note:
                  type: string
      responses:
        '201':
          description: Evidence uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiskEvidence'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalServerError'
