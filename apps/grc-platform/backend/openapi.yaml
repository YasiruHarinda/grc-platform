  /api/v1/risks:
    get:
      tags:
      - Risks
      summary: List risks
      description: Spreadsheet-style column filtering — every multi-value field is OR-matched within itself and AND-matched against the others. A caller who holds only CompleteActionSteps (Action Owner) is scoped to risks where they own an action plan.
      operationId: listRisks
      parameters:
      - name: statuses
        in: query
        description: Comma-separated workflow_status values.
        schema:
          type: string
      - name: team_id
        in: query
        description: Comma-separated source_register_id values.
        schema:
          type: string
      - name: level
        in: query
        description: Comma-separated LOW | MEDIUM | HIGH values.
        schema:
          type: string
      - name: search
        in: query
        description: Matched against risk_code and risk_title.
        schema:
          type: string
      - name: risk_type
        in: query
        description: Comma-separated NEW | UPDATED values.
        schema:
          type: string
      - name: owner_id
        in: query
        description: Comma-separated owner user IDs.
        schema:
          type: string
      - name: submitted_from
        in: query
        description: created_at >= this date (YYYY-MM-DD).
        schema:
          type: string
          format: date
      - name: submitted_to
        in: query
        description: created_at <= this date (YYYY-MM-DD).
        schema:
          type: string
          format: date
      - name: due_from
        in: query
        description: implementation_date >= this date (YYYY-MM-DD).
        schema:
          type: string
          format: date
      - name: due_to
        in: query
        description: implementation_date <= this date (YYYY-MM-DD).
        schema:
          type: string
          format: date
      - name: due_overdue
        in: query
        description: '"true" to additionally restrict to implementation_date < today.'
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
      - name: open_escalation
        in: query
        description: '"true" restricts to risks carrying an unresolved (OPEN) escalation — what the Overdue Risks tab filters on.'
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
      - name: limit
        in: query
        schema:
          type: integer
          default: 50
          maximum: 200
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
      responses:
        '200':
          description: Paginated risk list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiskListPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
      - Risks
      summary: Create a risk
      description: Atomically generates a risk code and creates the risk, action plan, steps, compliance-reference links, and change-log entry inside one DB transaction.
      operationId: createRisk
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRiskRequest'
      responses:
        '201':
          description: Risk created
          headers:
            Location:
              description: /api/v1/risks/{id}
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateRiskResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
