# Runner release
#
# This is the first GitHub Actions workflow in this repository, so here is
# the whole mental model in one place.
#
# Trigger: pushing a tag that matches "runner-v*", for example "runner-v0.1.0".
# The "runner-" prefix is deliberate. This is a monorepo: apps/grc-platform
# also lives here and will one day want its own tags and its own releases,
# so tags are namespaced by app rather than being bare version numbers.
#
# What it does: builds an sdist and a wheel from apps/evidence-app/runner
# and attaches both files to a GitHub Release named after the tag.
#
# How to cut a release:
#   1. Set the version in apps/evidence-app/runner/pyproject.toml to the one
#      you want to publish. This workflow reads that file, it does not set the
#      version for you, but it does refuse to run if the tag disagrees with it.
#   2. Tag that commit and push the tag, e.g.:
#        git tag runner-v0.1.0
#        git push origin runner-v0.1.0
#   3. Pushing the tag triggers this workflow. It checks the tag against the
#      version, runs the test suite, builds the package, and creates a GitHub
#      Release called "runner-v0.1.0" with the sdist and wheel attached as
#      downloadable files.
#
# Two things have to pass before anything is published: the tag must match the
# version in pyproject.toml, and the whole test suite must be green. Both run
# before the build. A release page is the one place users install from, so a
# tagged commit that does not build the version it claims, or whose tests do
# not pass, must not be able to reach it.
#
# Only first-party GitHub actions are used here (actions/checkout,
# actions/setup-python), plus the gh CLI that ships preinstalled on GitHub's
# runners, authenticated with the automatic, run-scoped GITHUB_TOKEN. No
# third-party marketplace action is used anywhere in this file. This is a
# governance, risk and compliance tool: a third-party action would mean
# arbitrary code, from a publisher we do not control, running with access
# to this repository's tokens on every release, and that is a supply-chain
# question nobody on this project has signed up to answer.

name: Runner release

on:
  push:
    tags:
      - "runner-v*"

# Explicit and minimal. This job only needs to read the repository's code
# and create a release with files attached, so it gets exactly those two
# permissions and nothing else.
permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/evidence-app/runner
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # Pinned to 3.11, the floor set by runner/pyproject.toml's
      # "requires-python = >=3.11". Building on the oldest supported version
      # is deliberate: it is the version most likely to catch a dependency
      # or syntax choice that would break for someone on that same floor.
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # First, and before anything slow runs. The release title and the built
      # wheel both take their version from pyproject.toml while the tag comes
      # from the push, so tagging runner-v0.2.0 without bumping the file used
      # to publish a release titled "Runner v0.1.0" containing a 0.1.0 wheel,
      # with nothing to stop it. A trailing suffix is allowed so pre-release
      # tags like runner-v0.1.0-rc1 still work against a 0.1.0 package.
      - name: Check the tag matches the package version
        id: package
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          case "$GITHUB_REF_NAME" in
            "runner-v$version"|"runner-v$version-"*) ;;
            *)
              echo "Tag $GITHUB_REF_NAME does not match version $version in pyproject.toml."
              echo "Bump the version in the file, or delete the tag and push the right one."
              exit 1
              ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # pytest is installed explicitly because pyproject.toml declares runtime
      # dependencies only. Installing the package itself as well is deliberate:
      # it proves the dependency list actually resolves on the oldest supported
      # Python before a wheel built from it is offered to anyone.
      - name: Install the package and run the tests
        run: |
          python -m pip install -e . pytest
          python -m pytest -q

      - name: Install the build tool
        run: python -m pip install --upgrade build

      - name: Build sdist and wheel
        run: python -m build

      # The wheel's filename is captured because the release notes below need
      # it to build a real download URL. That URL is entirely predictable once
      # the tag and the filename are known, so the notes can carry a link the
      # reader can actually copy rather than a placeholder telling them to go
      # and find it themselves. A placeholder would undo the whole point of a
      # one command install.
      - name: Read the built wheel's filename
        id: wheel
        run: echo "wheel=$(basename dist/*.whl)" >> "$GITHUB_OUTPUT"

      # Written to a file rather than passed inline, so the notes can be
      # several paragraphs with real line breaks instead of one long
      # sentence squeezed into a shell argument.
      #
      # The migration warning is repeated here even though the README also
      # carries it. Someone arriving at a release page to download the
      # wheel has not necessarily read the README, and if they installed
      # with the old install.sh their stale launcher at
      # ~/.local/bin/wso2-runner will silently shadow this one and keep
      # running the old code. That failure is invisible and confusing, so
      # the warning belongs where the download is.
      - name: Write the release notes
        id: notes
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<NOTES
          ## Install

          \`\`\`bash
          curl -LsSf https://astral.sh/uv/install.sh | sh
          uv tool install https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ steps.wheel.outputs.wheel }}
          wso2-runner configure --server https://<portal address>
          az login
          wso2-runner doctor
          wso2-runner start
          \`\`\`

          Google Chrome must be installed. The Runner drives the machine's own
          Chrome by default. If you cannot install Chrome, set
          \`BROWSER_CHANNEL=chromium\` and the Runner will download and use its
          own browser instead.

          ## Upgrading from the old install.sh

          If you installed with \`install.sh\` before, you have a launcher at
          \`~/.local/bin/wso2-runner\` that will shadow this one, so your
          commands would keep running the old code. Remove it first:

          \`\`\`bash
          rm ~/.local/bin/wso2-runner
          rm -rf ~/.wso2-runner/venv
          \`\`\`

          Your settings in \`~/.wso2-runner/.env\` are not affected. Once the old
          launcher and venv are gone, any clone of this repository kept only for
          running the Runner can be deleted.

          Full install steps: apps/evidence-app/runner/README.md
          NOTES

      - name: Create the release and upload the built files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "Runner v${{ steps.package.outputs.version }}" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            dist/*
