  /grants/by-email/{email}:
    get:
      tags:
      - Role Grants
      summary: Get a user's role grants by email
      description: >-
        Resolves a user by email and returns their active grants in one round
        trip. This is the hot path — the GRC backend calls it on every
        authenticated request to build the caller's scoped privilege set.


        Responses are never cached (Cache-Control: no-store) and must not be
        cached by callers either. Revoking a grant has to take effect on the
        caller's next request, which is why this data does not ride along on the
        user payload, which is cached for five minutes.


        A user who does not exist returns 404 rather than an empty grant list,
        so callers can distinguish "holds no roles" from "not provisioned here".
      operationId: getGrantsByEmail
      parameters:
      - name: email
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The user's active grants
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserGrantsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /grants/by-uuid/{uuid}:
    get:
      tags:
      - Role Grants
      summary: Get a user's role grants by Asgardeo uuid
      description: >-
        Resolves a user by uuid and returns their active grants in one round
        trip — the uuid counterpart of GET /grants/by-email, kept alongside
        it (not a replacement) until every backend caller has redeployed onto
        uuid-based auth. Same no-store, not-cached, 404-on-unknown-user
        contract as by-email.
      operationId: getGrantsByUUID
      parameters:
      - name: uuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The user's active grants
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserGrantsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /grants/user/{id}:
    get:
      tags:
      - Role Grants
      summary: Get a user's role grants by user ID
      description: >-
        Not yet wired up: the handler exists but internal/server/routes.go
        deliberately does not register it until the MANAGE_USERS-gated admin
        grant editor is built to call it (see the routes.go comment above the
        Role Grants block). Calling this path today 404s. Documented here for
        the client the admin editor will generate against, not as a currently
        reachable endpoint.
      x-internal: true
      operationId: getGrantsByUserId
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: The user's active grants
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserGrantsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
      - Role Grants
      summary: Grant a role to a user in a scope
      description: >-
        Idempotent: granting a role the user already holds reactivates the
        existing row and still returns 201, rather than conflicting on a request
        whose intent is already satisfied.


        Rejected with 400 when the scope type does not match the role's module,
        when a non-GLOBAL scope names no active team, or when the role carries
        MANAGE_USERS — grant management is only ever handed out GLOBAL.


        Not yet wired up: internal/server/routes.go deliberately does not
        register this handler until the MANAGE_USERS-gated admin grant editor
        is built to call it. Calling this path today 404s.
      x-internal: true
      operationId: createGrant
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserGrantRequest'
      responses:
        '201':
          description: The stored grant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserGrant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /grants/user/{id}/{grantId}:
    delete:
      tags:
      - Role Grants
      summary: Revoke a role grant
      description: >-
        Deactivates the grant rather than deleting it: who held what, and when
        it was taken away, is the history an authorisation change should leave
        behind. Scoped by user ID as well as grant ID, so a mismatched pair
        cannot revoke another user's grant.


        revokedBy is required and recorded in updated_by, so the row names who
        removed the grant as well as who conferred it (created_by).


        Not yet wired up: internal/server/routes.go deliberately does not
        register this handler until the MANAGE_USERS-gated admin grant editor
        is built to call it. Calling this path today 404s.
      x-internal: true
      operationId: revokeGrant
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      - name: grantId
        in: path
        required: true
        schema:
          type: integer
      - name: revokedBy
        in: query
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Grant revoked
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
