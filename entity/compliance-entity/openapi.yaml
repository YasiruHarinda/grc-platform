components:
  parameters:
    IntId:
      name: id
      in: path
      required: true
      schema:
        type: integer
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: The resource is not in a state that allows this action
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
    Pagination:
      type: object
      properties:
        limit:
          type: integer
          default: 20
          maximum: 100
        offset:
          type: integer
          default: 0
    User:
      type: object
      properties:
        id:
          type: integer
        uuid:
          type: string
          description: The user's Asgardeo id — the same value their OIDC token carries as `sub`. Empty when the row predates the identity migration and no Asgardeo account could be matched to its email yet.
        email:
          type: string
        displayName:
          type: string
        userType:
          type: string
          enum:
          - INTERNAL
          - EXTERNAL
        auditTeamIds:
          type: array
          items:
            type: integer
          description: Audit teams this user belongs to (many-to-many via user_audit_team). Always present, empty when the user has no audit team membership.
        riskTeamId:
          type: integer
          nullable: true
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
          - REMOVED
        createdOn:
          type: string
          format: date-time
        updatedOn:
          type: string
          format: date-time
    SearchUsersRequest:
      type: object
      properties:
        searchQuery:
          type: string
        statusKey:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
          - REMOVED
        pagination:
          $ref: '#/components/schemas/Pagination'
    SearchUsersResponse:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/User'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
    CreateUserRequest:
      type: object
      properties:
        email:
          type: string
        displayName:
          type: string
        userType:
          type: string
        auditTeamIds:
          type: array
          items:
            type: integer
          description: Audit teams to assign this user to at creation. Omit or send an empty array for no team membership.
        status:
          type: string
        createdBy:
          type: string
    UpdateUserRequest:
      type: object
      properties:
        displayName:
          type: string
          nullable: true
        userType:
          type: string
          nullable: true
          enum:
          - INTERNAL
          - EXTERNAL
        auditTeamIds:
          type: array
          items:
            type: integer
          description: Replaces the user's full set of audit team memberships. Omit this field to leave memberships unchanged; send an empty array to clear all of them.
        status:
          type: string
          nullable: true
        updatedBy:
          type: string
    Role:
      type: object
      properties:
        id:
          type: integer
        roleName:
          type: string
        description:
          type: string
        module:
          type: string
          enum: [RISK, AUDIT, SHARED]
          description: >-
            Determines which scope types this role may be granted against. The
            role decides the module; the scope decides the breadth.
        scopeBasis:
          type: string
          enum: [SOURCE_REGISTER, ASSIGNMENT_TEAM]
          description: >-
            Which column of a risk a grant on this role scopes by. Omitted for
            GLOBAL-only roles — every audit role included, since audit_control
            has only one team column.
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
    ListRolesResponse:
      type: object
      properties:
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
    UserGrant:
      type: object
      description: >-
        One role held by one user in one scope. Carries the role name rather
        than its privileges, since callers already hold the whole
        role-to-privilege map from GET /role-privileges and resolve locally.
      properties:
        id:
          type: integer
        roleId:
          type: integer
        roleName:
          type: string
        module:
          type: string
          enum: [RISK, AUDIT, SHARED]
        scopeType:
          type: string
          enum: [GLOBAL, RISK_TEAM, AUDIT_TEAM]
          description: >-
            GLOBAL is a wildcard covering every scope the role's module defines,
            including teams created later. It is never expanded into one row per
            team.
        scopeId:
          type: integer
          description: 0 when scopeType is GLOBAL; otherwise a risk_team or audit_team id.
        scopeBasis:
          type: string
          enum: [SOURCE_REGISTER, ASSIGNMENT_TEAM]
          description: >-
            The role's scope basis: SOURCE_REGISTER matches where a risk was
            raised, ASSIGNMENT_TEAM matches where the work was routed. Omitted
            for GLOBAL-only roles.
        scopeTeamType:
          type: string
          enum: [SOURCE_REGISTER, ASSIGNMENT, BOTH, AUDIT_TEAM]
          description: >-
            The scoped team's own team_type. Omitted for GLOBAL grants.
        scopeName:
          type: string
          description: The team's display name. Omitted for GLOBAL grants.
        createdOn:
          type: string
          format: date-time
        createdBy:
          type: string
    UserGrantsResponse:
      type: object
      properties:
        userId:
          type: integer
        grants:
          type: array
          description: >-
            Always present, possibly empty. Holding no grants is a legitimate
            state — someone named as an Action Owner may hold no role at all and
            reach only the risks they are personally named on.
          items:
            $ref: '#/components/schemas/UserGrant'
    CreateUserGrantRequest:
      type: object
      required: [roleId, scopeType]
      properties:
        roleId:
          type: integer
        scopeType:
          type: string
          enum: [GLOBAL, RISK_TEAM, AUDIT_TEAM]
        scopeId:
          type: integer
          description: >-
            Omit or send 0 for GLOBAL. Required, and must name an active team,
            for any other scope type.
        createdBy:
          type: string
    AuditTeam:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        status:
          type: string
        createdOn:
          type: string
          format: date-time
        updatedOn:
          type: string
          format: date-time
    SearchAuditTeamsRequest:
      type: object
      properties:
        searchQuery:
          type: string
        statusKey:
          type: string
        pagination:
          $ref: '#/components/schemas/Pagination'
    SearchAuditTeamsResponse:
      type: object
      properties:
        teams:
          type: array
          items:
            $ref: '#/components/schemas/AuditTeam'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
    CreateAuditTeamRequest:
      type: object
      properties:
        name:
          type: string
        status:
          type: string
        createdBy:
          type: string
    UpdateAuditTeamRequest:
      type: object
      properties:
        name:
          type: string
          nullable: true
        status:
          type: string
          nullable: true
        updatedBy:
          type: string
    AuditFramework:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        status:
          type: string
        createdOn:
          type: string
          format: date-time
        updatedOn:
          type: string
          format: date-time
    SearchAuditFrameworksRequest:
      type: object
      properties:
        searchQuery:
          type: string
        statusKey:
          type: string
        scope:
          type: string
          enum: [all, owned, assigned, team, none]
          description: >-
            Row-scoping rule: a framework matches when it has at least one
            audit with at least one control in scope. Omitted/empty scope
            matches nothing; internal callers that want every row must send
            "all" explicitly.
        userEmail:
          type: string
        scopeTeamIds:
          type: array
          items:
            type: integer
          description: >-
            Server-derived team(s) the caller manages, from the caller's
            grants. Only read when scope is "team".
        pagination:
          $ref: '#/components/schemas/Pagination'
    SearchAuditFrameworksResponse:
      type: object
      properties:
        frameworks:
          type: array
          items:
            $ref: '#/components/schemas/AuditFramework'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
    CreateAuditFrameworkRequest:
      type: object
      properties:
        name:
          type: string
        status:
          type: string
        createdBy:
          type: string
    UpdateAuditFrameworkRequest:
      type: object
      properties:
        name:
          type: string
          nullable: true
        status:
          type: string
          nullable: true
        updatedBy:
          type: string
    AuditProduct:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        status:
          type: string
        createdOn:
          type: string
          format: date-time
        updatedOn:
          type: string
          format: date-time
    SearchAuditProductsRequest:
      type: object
      properties:
        searchQuery:
          type: string
        statusKey:
          type: string
        pagination:
          $ref: '#/components/schemas/Pagination'
    SearchAuditProductsResponse:
      type: object
      properties:
        products:
          type: array
          items:
            $ref: '#/components/schemas/AuditProduct'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
    CreateAuditProductRequest:
      type: object
      properties:
        name:
          type: string
        status:
          type: string
        createdBy:
          type: string
    UpdateAuditProductRequest:
      type: object
      properties:
        name:
          type: string
          nullable: true
        status:
          type: string
          nullable: true
        updatedBy:
          type: string
    Audit:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        frameworkId:
          type: integer
        frameworkName:
          type: string
        productId:
          type: integer
        productName:
          type: string
        periodStart:
          type: string
        periodEnd:
          type: string
        status:
          type: string
          enum:
          - ACTIVE
          - COMPLETED
          - ARCHIVED
          - REMOVED
        scopeDescription:
          type: string
          nullable: true
        controlsTotal:
          type: integer
        controlsApproved:
          type: integer
        controlsOverdue:
          type: integer
        createdOn:
          type: string
          format: date-time
        updatedOn:
          type: string
          format: date-time
    SearchAuditsRequest:
      type: object
      properties:
        searchQuery:
          type: string
        statusKeys:
          type: array
          items:
            type: string
        frameworkIds:
          type: array
          items:
            type: integer
        productIds:
          type: array
          items:
            type: integer
        auditIds:
          type: array
          items:
            type: integer
          description: >-
            Restrict to specific audit ids — used by the GRC Backend's
            single-item scope check.
        scope:
          type: string
          enum: [all, owned, assigned, team, none]
          description: >-
            Row-scoping rule: an audit matches only if it has at least one
            control within scope. Omitted/empty scope matches nothing;
            internal callers that want every row must send "all" explicitly.
        userEmail:
          type: string
        scopeTeamIds:
          type: array
          items:
            type: integer
          description: >-
            Server-derived team(s) the caller manages, from the caller's
            grants. Only read when scope is "team".
        pagination:
          $ref: '#/components/schemas/Pagination'
    SearchAuditsResponse:
      type: object
      properties:
        audits:
          type: array
          items:
            $ref: '#/components/schemas/Audit'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
    CreateAuditRequest:
      type: object
      properties:
        name:
          type: string
        frameworkId:
          type: integer
        productId:
          type: integer
        periodStart:
          type: string
        periodEnd:
          type: string
        scopeDescription:
          type: string
          nullable: true
        createdBy:
          type: string
    UpdateAuditRequest:
      type: object
      properties:
        name:
          type: string
          nullable: true
        status:
          type: string
          nullable: true
        periodStart:
          type: string
          nullable: true
        periodEnd:
          type: string
          nullable: true
        scopeDescription:
          type: string
          nullable: true
        updatedBy:
          type: string
    AuditControl:
      type: object
      properties:
        id:
          type: integer
        auditId:
          type: integer
        controlNumber:
          type: string
        description:
          type: string
        evidenceRequirement:
          type: string
          nullable: true
        requirementType:
          type: string
          enum:
          - DESIGN
          - OE
        controlType:
          type: string
          enum:
          - CONFIG
          - NON_CONFIG
        scope:
          type: string
          enum:
          - COMMON
          - PRODUCT_SPECIFIC
        ownerId:
          type: integer
          nullable: true
        ownerName:
          type: string
          nullable: true
        teamId:
          type: integer
          nullable: true
        teamName:
          type: string
          nullable: true
        auditorId:
          type: integer
          nullable: true
        auditorName:
          type: string
          nullable: true
        auditorEmail:
          type: string
          nullable: true
        dueDate:
          type: string
          nullable: true
        controlSource:
          type: string
          enum:
          - MANUAL
          - COPIED
          - CSV
        status:
          type: string
          enum:
          - POPULATION_PENDING
          - POPULATION_INTERNAL_REVIEW
          - POPULATION_UNDER_VALIDATION
          - POPULATION_NEED_CLARIFICATION
          - POPULATION_COMPLETE
          - AWAITING_SAMPLE
          - SUBMITTED_SAMPLE
          - EVIDENCE_PENDING
          - EVIDENCE_INTERNAL_REVIEW
          - EVIDENCE_UNDER_VALIDATION
          - EVIDENCE_NEED_CLARIFICATION
          - COMPLETE
        statusOverridden:
          type: boolean
          description: Whether this control's current status was set by a backward status override rather than the ordinary workflow.
        overriddenBy:
          type: string
          nullable: true
        overriddenAt:
          type: string
          format: date-time
          nullable: true
        isOverdue:
          type: boolean
        createdOn:
          type: string
          format: date-time
        updatedOn:
          type: string
          format: date-time
        populationDescription:
          type: string
          nullable: true
        populationComments:
          type: string
          nullable: true
        populationDueDate:
          type: string
          nullable: true
        populationOwnerName:
          type: string
          nullable: true
        populationTeamName:
          type: string
          nullable: true
    SearchControlsRequest:
      type: object
      properties:
        searchQuery:
          type: string
        statusKeys:
          type: array
          items:
            type: string
        requirementTypes:
          type: array
          items:
            type: string
        teamIds:
          type: array
          items:
            type: integer
        auditorIds:
          type: array
          items:
            type: integer
        ownerIds:
          type: array
          items:
            type: integer
        controlIds:
          type: array
          items:
            type: integer
          description: >-
            Restrict to specific control ids — used by the GRC Backend's
            single-item scope check.
        scope:
          type: string
