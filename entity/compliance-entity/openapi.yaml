openapi: 3.0.3
info:
  title: GRC Platform – Compliance Entity Service
  description: Internal entity service exposing all audit and risk data from the GRC Platform MySQL database. Authentication
    is handled by the Choreo API Gateway; this service is only reachable by other Choreo components within the same organisation.
  version: 1.1.0
servers:
- url: http://localhost:8080
  description: Local development
tags:
- name: Health
- name: Files
- name: Users
- name: Audit Teams
- name: Audit Frameworks
- name: Audit Framework Controls
- name: Audit Products
- name: Audits
- name: Audit Trail
- name: Audit Dashboard
- name: Controls
- name: Audit Controls
- name: Evidence
- name: Audit Evidence
- name: Comments
- name: AI Validations
- name: Populations
- name: Risk Teams
- name: Risk Scores
- name: Risk Compliance References
- name: Privileges
- name: Role Grants
- name: Risk Dashboard
- name: Risk Analytics
- name: Risks
- name: Risk Action Plans
- name: Risk Action Steps
- name: Risk Escalations
- name: Risk Change Log
- name: Risk Notifications
- name: Risk Evidence
- name: Risk Assessments
paths:
  /health:
    get:
      tags:
      - Health
      summary: Liveness/readiness probe
      operationId: healthCheck
      responses:
        '200':
          description: Liveness/readiness probe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /files:
    post:
      tags:
      - Files
      summary: Upload a file to Azure Blob Storage
      operationId: uploadFile
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - blobName
              - file
              properties:
                blobName:
                  type: string
                  description: Destination blob path. Must match one of the allowed layouts audit/{auditName}/{controlNumber}/evidence/{file}, audit/{auditName}/{controlNumber}/population/{file}, audit/{auditName}/{controlNumber}/population/sample/{file}, or risks/{riskId}/evidence/{timestamp}/{file}.
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: File uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlobUploadResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          description: File too large (max 25 MiB)
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags:
      - Files
      summary: Download a file from Azure Blob Storage
      operationId: downloadFile
      parameters:
      - name: path
        in: query
        required: true
        schema:
          type: string
        description: Blob path. Must match one of the allowed layouts audit/{auditName}/{controlNumber}/evidence/{file}, audit/{auditName}/{controlNumber}/population/{file}, audit/{auditName}/{controlNumber}/population/sample/{file}, or risks/{riskId}/evidence/{timestamp}/{file}.
      responses:
        '200':
          description: File bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
      - Files
      summary: Delete a file from Azure Blob Storage
      operationId: deleteFile
      parameters:
      - name: path
        in: query
        required: true
        schema:
          type: string
        description: Blob path. Must match one of the allowed layouts audit/{auditName}/{controlNumber}/evidence/{file}, audit/{auditName}/{controlNumber}/population/{file}, audit/{auditName}/{controlNumber}/population/sample/{file}, or risks/{riskId}/evidence/{timestamp}/{file}.
      responses:
        '204':
          description: File deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /files/list:
    get:
      tags:
      - Files
      summary: List files in a blob folder
      operationId: listFiles
      parameters:
      - name: prefix
        in: query
        required: true
        schema:
          type: string
        description: Folder prefix matching one of the allowed layouts audit/{auditName}/{controlNumber}/evidence/, audit/{auditName}/{controlNumber}/population/, or audit/{auditName}/{controlNumber}/population/sample/. The trailing slash is optional — both the slash-terminated form and the slashless form (e.g. audit/{auditName}/{controlNumber}/evidence) are accepted. Unlike upload/download/delete, listing does not accept the risks/ tree.
      responses:
        '200':
          description: List of blobs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlobListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /users/search:
    post:
      tags:
      - Users
      summary: Search users
      operationId: searchUsers
      requestBody:
