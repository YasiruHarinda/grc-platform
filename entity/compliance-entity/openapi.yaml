          type: array
          description: Filter by audit.id; empty/omitted = all audits.
          items:
            type: integer
        controlNumber:
          type: string
          description: Case-insensitive substring match on control_number; empty/omitted = no filter.
        statuses:
          type: array
          description: Filter by audit_control.status; empty/omitted = all statuses. The backend resolves both the status and action-needed UI filters into this set.
