        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /users/by-uuid/{uuid}:
    get:
      tags:
      - Users
      summary: Get a user by Asgardeo uuid
      description: >-
        The identity path this platform resolves through going forward — the
        `sub` claim of the caller's OIDC token, not their email. Literal
        second path segment for the same collision-avoidance reason as
        by-email: "/users/by-uuid/{uuid}" cannot collide with "/users/{id}"
        (different segment counts) or with by-email (different literal
        second segment).
      operationId: getUserByUUID
      parameters:
      - name: uuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Get a user by uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /users/{id}:
